<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{p.nombre}} | GvO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), 
                        url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=2069');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: 'Inter', sans-serif; 
        }
        .product-container { 
            background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(15px);
            border-radius: 30px; border: 1px solid rgba(212, 175, 55, 0.2); 
            padding: 40px; margin-top: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .price-tag { color: #ff3131; font-size: 3.5rem; font-family: 'Orbitron', sans-serif; line-height: 1; }
        .btn-order { 
            background: linear-gradient(90deg, #25D366, #1da851); color: white; 
            padding: 20px; border-radius: 15px; font-weight: 800; font-size: 1.2rem; 
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; border: none;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }
        .btn-order:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(37, 211, 102, 0.4); color: white; }
        .back-btn { color: #d4af37; text-decoration: none; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .back-btn:hover { color: white; padding-left: 5px; }
        .text-box { background: rgba(0,0,0,0.5); padding: 25px; border-radius: 15px; border-left: 4px solid #d4af37; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <a href="javascript:history.back()" class="back-btn mb-4 d-inline-block">← Volver al catálogo</a>
        <div class="product-container">
            <div class="row align-items-center g-5">
                <div class="col-md-6 text-center">
                    <div style="background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, transparent 70%); padding: 20px;">
                        <img src="/static/{{p.img}}" class="img-fluid" style="max-height: 500px; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.9));">
                    </div>
                </div>
                <div class="col-md-6 px-lg-4">
                    <span class="badge text-dark mb-3 px-3 py-2" style="background: #d4af37; font-weight: 900; letter-spacing: 1px;">STOCK INMEDIATO</span>
                    <h1 class="display-4 fw-bold mb-3" style="font-family: 'Orbitron';">{{p.nombre}}</h1>
                    <div class="price-tag mb-4">{{p.precio}}</div>
                    
                    <div class="text-box mb-5">
                        <p class="text-light fs-6 mb-0" style="line-height: 1.8; white-space: pre-line;">{{p.detalle}}</p>
                    </div>
                    
                    <a href="https://wa.me/5358870159?text=Hola GvO, quiero comprar el {{p.nombre}}." class="btn btn-order w-100 d-block text-center text-decoration-none">
                        COMPRAR AHORA POR WHATSAPP
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
