<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{p.nombre}} | GvO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Inter', sans-serif; }
        .product-container { background: #111; border-radius: 30px; border: 1px solid #222; padding: 30px; margin-top: 20px; }
        .price-tag { color: #ff3131; font-size: 3rem; font-weight: 900; }
        .btn-order { 
            background: #25D366; color: white; padding: 20px; border-radius: 15px;
            font-weight: 800; font-size: 1.2rem; transition: 0.3s;
        }
        .btn-order:hover { background: #1da851; transform: scale(1.02); color: white; }
        .back-btn { color: #666; text-decoration: none; transition: 0.3s; }
        .back-btn:hover { color: #ff3131; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <a href="javascript:history.back()" class="back-btn mb-4 d-inline-block">← Volver al catálogo</a>
        <div class="product-container shadow-lg">
            <div class="row align-items-center">
                <div class="col-md-6 text-center">
                    <img src="/static/{{p.img}}" class="img-fluid rounded" style="max-height: 500px; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));">
                </div>
                <div class="col-md-6 px-lg-5">
                    <span class="badge bg-danger mb-2">PRODUCTO CERTIFICADO</span>
                    <h1 class="display-4 fw-bold mb-3">{{p.nombre}}</h1>
                    <div class="price-tag mb-4">{{p.precio}} <small class="fs-6 text-muted">CUP</small></div>
                    <p class="text-secondary fs-5 mb-5">{{p.detalle}}</p>
                    <a href="https://wa.me/5358870159?text=Hola Gustavo, me interesa el {{p.nombre}}." class="btn btn-order w-100 text-center text-decoration-none">
                        COMPRAR POR WHATSAPP
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
