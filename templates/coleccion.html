<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{coleccion.nombre}} | GvO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.95)), 
                        url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=2069');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: 'Inter', sans-serif; 
        }
        .back-link { color: #d4af37; text-decoration: none; font-weight: 600; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .back-link:hover { padding-left: 8px; color: white; }
        
        .item-box { 
            background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(10px);
            border-radius: 20px; border: 1px solid rgba(255, 215, 0, 0.1);
            transition: 0.4s; cursor: pointer; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .item-box:hover { transform: translateY(-8px); border-color: #d4af37; box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15); }
        
        .item-img { height: 220px; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .item-img img { max-height: 100%; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); transition: 0.4s; }
        .item-box:hover .item-img img { transform: scale(1.08); }
        
        .price { font-size: 1.6rem; font-weight: 900; color: #ff3131; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <a href="/" class="back-link mb-4 d-inline-block">← Regresar al Inicio</a>
        <h2 class="fw-bold mb-5 text-uppercase" style="font-family: 'Orbitron'; letter-spacing: 2px; color: #d4af37;">{{coleccion.nombre}}</h2>
        
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for p in items %}
            <div class="col" onclick="location.href='/producto/{{p.id}}'">
                <div class="item-box p-4 h-100 d-flex flex-column text-center">
                    <div class="item-img mb-3">
                        <img src="/static/{{p.img}}" class="img-fluid">
                    </div>
                    <h5 class="fw-bold mb-2 text-white">{{p.nombre}}</h5>
                    <p class="price mt-auto mb-3">{{p.precio}}</p>
                    <span class="badge w-100 py-2" style="background: rgba(212, 175, 55, 0.2); color: #d4af37; border: 1px solid #d4af37;">VER DETALLES</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
