<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GvO Motriz | Premium Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        :root { 
            --gold: #d4af37; 
            --red: #ff3131; 
            --glass-bg: rgba(15, 15, 15, 0.65);
            --glass-border: rgba(255, 215, 0, 0.15);
        }
        
        /* Fondo fijo con auto de alta gama */
        body { 
            background: linear-gradient(rgba(5, 5, 5, 0.8), rgba(5, 5, 5, 0.9)), 
                        url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?q=80&w=2069');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; /* Hace que el auto se quede quieto al bajar */
            color: white; 
            font-family: 'Inter', sans-serif; 
        }
        
        header { 
            height: 55vh; display: flex; align-items: center; justify-content: center;
            flex-direction: column; text-align: center; position: relative;
        }

        .logo-main { 
            font-family: 'Orbitron', sans-serif; font-size: clamp(3rem, 10vw, 5.5rem); 
            letter-spacing: 2px; color: white; text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .logo-main span { color: var(--gold); }

        /* Tarjetas efecto cristal ahumado */
        .cat-card {
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); /* Efecto cristal */
            border: 1px solid var(--glass-border);
            border-radius: 20px; overflow: hidden; transition: 0.4s ease;
            cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .cat-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--gold); 
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2); 
        }
        
        .img-wrapper { 
            height: 300px; padding: 30px; 
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 80%);
            display: flex; align-items: center; justify-content: center;
        }
        .img-wrapper img { max-height: 100%; transition: 0.5s; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6)); }
        .cat-card:hover img { transform: scale(1.1) translateY(-5px); }
        
        .btn-linea { 
            background: linear-gradient(90deg, #b8860b, var(--gold)); color: black; font-weight: 900; 
            padding: 15px; border: none; width: 100%; text-transform: uppercase; font-size: 1rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header data-aos="zoom-in" data-aos-duration="1200">
        <h1 class="logo-main">GvO <span>MOTRIZ</span></h1>
        <p class="text-uppercase fw-bold" style="letter-spacing: 4px; color: #ccc;">El Cuidado Superior Para Tu Vehículo</p>
    </header>

    <div class="container py-5">
        <div class="row g-4">
            {% for c in colecciones %}
            <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
                <div class="cat-card h-100 d-flex flex-column" onclick="location.href='/coleccion/{{c.id}}'">
                    <div class="img-wrapper">
                        <img src="/static/{{c.img}}" alt="{{c.nombre}}">
                    </div>
                    <div class="p-4 text-center flex-grow-1 border-top border-secondary border-opacity-25">
                        <h3 class="h4 fw-bold text-white">{{c.nombre}}</h3>
                        <p class="small text-light opacity-75">{{c.desc}}</p>
                    </div>
                    <button class="btn-linea">EXPLORAR LÍNEA</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>AOS.init({ once: true });</script>
</body>
</html>
