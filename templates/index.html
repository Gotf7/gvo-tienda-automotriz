<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GvO Motriz | High Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        :root { --red: #ff3131; --black: #0a0a0a; --dark-gray: #1a1a1a; --text-gray: #a0a0a0; }
        body { background-color: var(--black); color: white; font-family: 'Inter', sans-serif; }
        
        header { 
            height: 60vh; display: flex; align-items: center; justify-content: center;
            flex-direction: column; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), var(--black)), 
                        url('https://images.unsplash.com/photo-1486497395402-74117e35b710?q=80&w=2070');
            background-size: cover; background-position: center;
        }

        .logo-main { 
            font-family: 'Orbitron', sans-serif; font-size: clamp(2.5rem, 10vw, 5rem); 
            letter-spacing: 2px; color: white;
        }
        .logo-main span { color: var(--red); text-shadow: 0 0 20px rgba(255, 49, 49, 0.5); }

        .cat-card {
            background: var(--dark-gray); border: 1px solid #333;
            border-radius: 15px; overflow: hidden; transition: 0.4s;
            cursor: pointer; position: relative;
        }
        .cat-card:hover { transform: translateY(-10px); border-color: var(--red); }
        
        .img-wrapper { 
            height: 300px; padding: 20px; background: radial-gradient(circle, #222 0%, #111 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .img-wrapper img { max-height: 100%; transition: 0.5s; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }
        .cat-card:hover img { transform: scale(1.1) rotate(2deg); }
        
        .btn-linea { 
            background: var(--red); color: white; font-weight: 800; padding: 12px;
            border: none; width: 100%; text-transform: uppercase; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header data-aos="zoom-out" data-aos-duration="1000">
        <h1 class="logo-main">GvO <span>MOTRIZ</span></h1>
        <p class="text-uppercase fw-light" style="letter-spacing: 4px; color: var(--text-gray);">Premium Lubricants & Care</p>
    </header>

    <div class="container py-5">
        <div class="row g-4">
            {% for c in colecciones %}
            <div class="col-md-4" data-aos="fade-up">
                <div class="cat-card h-100" onclick="location.href='/coleccion/{{c.id}}'">
                    <div class="img-wrapper">
                        <img src="/static/{{c.img}}" alt="{{c.nombre}}">
                    </div>
                    <div class="p-4">
                        <h3 class="h5 fw-bold">{{c.nombre}}</h3>
                        <p class="small text-muted">{{c.desc}}</p>
                    </div>
                    <button class="btn-linea">Explorar Catálogo</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>AOS.init({ once: true });</script>
</body>
</html>
