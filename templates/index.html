<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GvO Motriz | Premium Performance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        :root { --accent-red: #e63946; --bg-light: #f8f9fa; --text-dark: #1d3557; }
        body { background-color: var(--bg-light); color: var(--text-dark); font-family: 'Poppins', sans-serif; }
        
                header { 
            /* 1. Le damos más altura para que el carro se vea mejor */
            height: 55vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-direction: column; 
            text-align: center;
            
            /* 2. Ajustamos el gradiente: el primer número (0.4) controla la claridad. 
               Mientras más bajo sea, más se verá el carro. */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(248, 249, 250, 1)), 
                        url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1000');
            
            background-size: cover; 
            background-position: center; 
            border-bottom: 3px solid var(--accent-red);
            position: relative;
        }

        /* 3. Para que las letras no se pierdan con el carro, les daremos un toque de sombra */
        .logo-main { 
            text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            font-size: clamp(2.2rem, 8vw, 4rem);
        }

        .logo-main { 
            font-family: 'Orbitron', sans-serif; 
            /* clamp(mínimo, preferido, máximo) - se adapta perfecto a móviles y PC */
            font-size: clamp(2.2rem, 8vw, 4rem); 
            color: #111; 
            line-height: 1.1;
        }
        .logo-main span { color: var(--accent-red); display: block; margin-top: 5px; }


        .cat-card {
            background: #ffffff; 
            border: 1px solid rgba(0,0,0,0.05); /* Contorno sutil */
            border-radius: 20px; /* Bordes más redondeados y modernos */
            box-shadow: 0 6px 15px rgba(0,0,0,0.04); 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); /* Transición súper fluida */
            cursor: pointer;
        }
        .cat-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 15px 30px rgba(230, 57, 70, 0.15); 
            border-color: rgba(230, 57, 70, 0.3); /* El borde resalta al pasar el mouse */
        }
        
        .img-wrapper { 
            height: 350px; /* Altura controlada */
            width: 100%;
            padding: 25px; 
            display: flex; align-items: center; justify-content: center; 
            background: #fff; 
        }
        .img-wrapper img { 
            width: 100%;
            height: 100%;
            object-fit: contain; /* Evita que la imagen se estire o se corte */
            transition: transform 0.5s ease; 
        }
        .cat-card:hover img { transform: scale(1.08); }
        
        .btn-action { 
            background: var(--accent-red); color: white; font-weight: 600; 
            border-radius: 0 0 20px 20px; /* Alineado con el borde de la tarjeta */
            padding: 14px; border: none; letter-spacing: 0.5px; transition: 0.3s ease; 
        }
        .btn-action:hover { background: #d62828; color: white; }
    </style>
</head>
<body>

    <header data-aos="fade-down" data-aos-duration="800">
        <h1 class="logo-main">AUTOMOTRIZ <span>GvO</span></h1>
        <p class="text-uppercase text-secondary fw-bold" style="letter-spacing: 1px;">Calidad y Rendimiento</p>
    </header>

    <div class="container py-5">
        <div class="row g-4">
            {% for c in colecciones %}
            <div class="col-md-4" data-aos="fade-up" data-aos-delay="100">
                <div class="cat-card h-100 d-flex flex-column" onclick="location.href='/coleccion/{{c.id}}'">
                    <div class="img-wrapper">
                        <img src="/static/{{c.img}}" class="img-fluid" loading="lazy" alt="{{c.nombre}}">
                    </div>
                    <div class="p-4 text-center flex-grow-1">
                        <h4 class="fw-bold">{{c.nombre}}</h4>
                        <p class="text-muted small">{{c.desc}}</p>
                    </div>
                    <button class="btn-action w-100">VER LÍNEA</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>AOS.init({ once: true });</script>
</body>
</html>
